<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>IELTS Preparation Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-color: #fff;
      --text-color: #000;
      --accent-color: #ddd;
      --card-bg: #f5f5f5;
      --border-radius: 8px;
      --transition: 0.2s ease-in-out;
      --font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.5;
    }

    header {
      text-align: center;
      padding: 1.5rem 0;
      font-size: 2rem;
      font-weight: 600;
      background: var(--accent-color);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem;
    }

    .section {
      margin-bottom: 2rem;
    }

    .section h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 0.25rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      margin: 0.5rem 0;
      padding: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .card:hover {
      background: var(--accent-color);
    }

    .word {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .details {
      margin-top: 0.5rem;
      display: none;
      font-size: 0.95rem;
      color: #999;
    }

    @media (max-width: 600px) {
      header {
        font-size: 1.5rem;
      }

      .section h2 {
        font-size: 1.3rem;
      }

      .word {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <header>IELTS Preparation Docs</header>
  <main>
    <ul>
      <li><a href="/ielts/v/index.html">Vocabulary</a></li>
      <li><a href="/ielts/100-Essential-Words-and-Phrases-for-Band-7-9-Success-2.pdf">Words & Phrases</a></li>
    </ul>
  </main>

</body>

</html>
